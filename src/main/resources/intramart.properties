# intra-mart Configuration
intramart.application.name=intra-mart Application
intramart.application.version=1.0.0
intramart.application.description=intra-mart環境のWebアプリケーション

# Logging Configuration
intramart.log.level=INFO
intramart.log.file=logs/intramart.log

# Session Configuration
intramart.session.timeout=1800
intramart.session.max.inactive.interval=1800

# Security Configuration
intramart.security.enabled=true
intramart.security.login.url=/login
intramart.security.logout.url=/logout

# Database Configuration
intramart.db.type=postgresql
intramart.db.schema=intramart_schema

# Cache Configuration
intramart.cache.enabled=true
intramart.cache.type=ehcache
intramart.cache.max.elements=10000
intramart.cache.time.to.live=3600
